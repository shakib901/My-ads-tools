<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Telegram Mini Earning App</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- ✅ Monetag SDK -->
<script src="//libtl.com/sdk.js"
        data-zone="10539995"
        data-sdk="show_10539995"></script>

<style>
body{
  background:#f2f4f7;
  font-family:Arial,sans-serif;
  margin:0;
}
.card{
  max-width:420px;
  margin:30px auto;
  background:#fff;
  border-radius:15px;
  padding:20px;
  box-shadow:0 5px 15px rgba(0,0,0,.15);
}
h2{
  text-align:center;
  color:#1877f2;
}
.stats{
  display:flex;
  justify-content:space-between;
  background:#eef1f4;
  padding:15px;
  border-radius:10px;
  margin:20px 0;
}
.stats div{text-align:center;width:50%}
.stats h3{margin:0;color:green;font-size:26px}
button{
  width:100%;
  padding:14px;
  margin-top:10px;
  font-size:16px;
  border:none;
  border-radius:8px;
  color:#fff;
  cursor:pointer;
}
.blue{background:#1877f2}
.green{background:#28a745}
.red{background:#dc3545}
button:disabled{opacity:.6}
</style>
</head>

<body>
<div class="card">
  <h2>Telegram Mini Earning App</h2>

  <div class="stats">
    <div>
      <h3 id="ads">0</h3>
      <p>Ads Watched</p>
    </div>
    <div>
      <h3 id="points">0</h3>
      <p>Total Points</p>
    </div>
  </div>

  <button class="blue" onclick="rewardInterstitial()">🎥 Rewarded Interstitial</button>
  <button class="blue" onclick="rewardPopup()">📢 Rewarded Popup</button>

  <button class="green" onclick="withdraw()">Withdraw</button>
  <button class="red" onclick="resetData()">Reset</button>
</div>

<script>
let ads = Number(localStorage.getItem("ads")) || 0;
let points = Number(localStorage.getItem("points")) || 0;
let cooldown = false;

updateUI();

function updateUI(){
  adsEl.innerText = ads;
  pointsEl.innerText = points;
}

const adsEl = document.getElementById("ads");
const pointsEl = document.getElementById("points");

/* 🔹 Anti Spam Cooldown (High CPM Safe) */
function startCooldown(){
  cooldown = true;
  setTimeout(()=>cooldown=false, 8000); // 8 sec gap
}

/* ✅ Rewarded Interstitial */
function rewardInterstitial(){
  if(cooldown) return alert("Please wait a few seconds");
  startCooldown();

  show_10539995().then(()=>{
    ads++;
    points++;

    localStorage.setItem("ads", ads);
    localStorage.setItem("points", points);
    updateUI();

  }).catch(()=>{});
}

/* ✅ Rewarded Popup */
function rewardPopup(){
  if(cooldown) return alert("Please wait a few seconds");
  startCooldown();

  show_10539995('pop').then(()=>{
    ads++;
    points++;

    localStorage.setItem("ads", ads);
    localStorage.setItem("points", points);
    updateUI();

  }).catch(()=>{});
}

function withdraw(){
  if(points < 20){
    alert("Minimum 20 points required");
    return;
  }
  alert("Withdraw request sent!");
}

function resetData(){
  if(!confirm("Reset all data?")) return;
  localStorage.clear();
  ads = 0;
  points = 0;
  updateUI();
}
</script>
</body>
</html>
